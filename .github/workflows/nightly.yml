# Nightly pipeline of specs/00-engineering-baseline.md §14 step 6; the full scenario catalogue, load and failure
# injection are added by their own tickets; the mutation score of 20 §7 runs here.
name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-pact-check:
    name: Forward pact check
    runs-on: ubuntu-latest
    steps:
      # the release tags: the last one's providers verify this commit's pacts
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build this commit's pacts
        run: ./mvnw -B package
      - name: Forward pact check
        run: .github/scripts/pact-forward-check.sh

  # mutation score of specs/20-testing-strategy.md §7: fails below 85 %; the surviving mutants are reviewed weekly from
  # the uploaded report. PR builds never run -Pmutation.
  mutation-score:
    name: Mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # --fail-at-end: a module below the threshold still leaves the others' reports; the gateway's targets are
      # exercised by its component tests, which need the runner's Docker
      - name: Mutation testing
        run: >-
          ./mvnw -B --fail-at-end -Pmutation -Djacoco.skip=true
          -pl libs/payment-domain,services/ledger-service,services/payment-orchestrator,services/csm-gateway -am test
      - name: Publish the surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports
          path: '**/target/pit-reports/'
          if-no-files-found: warn
