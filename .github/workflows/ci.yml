# Pipeline of specs/00-engineering-baseline.md §14; later steps are added by their own tickets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLANTUML_VERSION: 1.2026.8
  PLANTUML_SHA256: 0f77e5f769836b3dee340e207fe497c3e4c43e973d559e3c306915da9c32e34c

jobs:
  build:
    name: Build and test (step 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  diagrams:
    name: PlantUML check (step 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download PlantUML
        run: |
          curl -sSfLo "$RUNNER_TEMP/plantuml.jar" \
            "https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/$PLANTUML_VERSION/plantuml-$PLANTUML_VERSION.jar"
          echo "$PLANTUML_SHA256  $RUNNER_TEMP/plantuml.jar" | sha256sum -c -
      - name: Check diagrams
        run: java -jar "$RUNNER_TEMP/plantuml.jar" -checkonly "architecture/**/*.puml"

  traceability:
    name: Traceability check (step 3)
    runs-on: ubuntu-latest
    steps:
      # full history: the pending-ids baseline is compared with main at the merge base (specs/20-testing-strategy.md §1)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check traceability
        run: java tools/traceability-check/src/main/java/com/tpe/traceabilitycheck/TraceabilityCheck.java

  local-stack:
    name: Local stack smoke check (step 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start infrastructure
        run: docker compose -f deploy/docker-compose.yml up -d --wait postgres kafka oauth2
      - name: Smoke check
        run: ./mvnw -B -pl tests/system-tests -am verify -Dtpe.local-stack=true
      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
