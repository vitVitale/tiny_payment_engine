# Loki 3, single binary, for the compose observability profile (specs/26-observability.md §13). Labels are those of
# §3 plus `level`; trace and payment identifiers arrive as structured metadata (§7).
auth_enabled: true

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # the agent sets `level`; no second, detected one
  discover_log_levels: false
  retention_period: 720h

analytics:
  reporting_enabled: false
