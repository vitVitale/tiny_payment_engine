# Bank routing directory (specs/01-shared-libraries.md §1.4), mounted into the services and pointed to by
# tpe.bank-directory.location; Spring binds tpe.bank-directory into an InMemoryBankDirectory. Static
# configuration: reloaded on restart only. Checked by BankDirectoryFileTest.
tpe:
  bank-directory:
    ownBankCode: "10010010"
    ownBic: "TPEBDEFFXXX"
    banks:
      - bankCode: "10010010"
        bic: "TPEBDEFFXXX"
        sctInstReachable: true
        vopEndpoint: null              # own bank: answered locally
      - bankCode: "20020020"
        bic: "PEERDEFFXXX"
        sctInstReachable: true
        vopEndpoint: "http://csm-simulator:8090/vop/v1/verifications"
