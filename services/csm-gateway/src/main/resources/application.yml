spring:
  application:
    name: csm-gateway
  config:
    # the bank directory (specs/01-shared-libraries.md §1.4): our own BIC
    import: ${tpe.bank-directory.location:classpath:bank-directory.yml}
  kafka:
    consumer:
      # a gateway that dies without leaving the group holds its csm.outbound.commands partitions, and the verdicts on
      # them, until its session ends: shorter than the answer deadline (specs/15-csm-gateway.md §4, #158); needs the
      # broker's group.min.session.timeout.ms at most this
      heartbeat-interval: 1s
      properties:
        session.timeout.ms: 3000

management:
  endpoint:
    health:
      probes:
        enabled: true

tpe:
  messaging:
    # outbox and inbox (specs/15-csm-gateway.md §4, §5)
    enabled: true
  # specs/15-csm-gateway.md §7
  csm:
    base-url: http://csm-simulator:8090
    # the CSM's BIC: the instructed agent of the pacs.028 the gateway sends (§6.6)
    bic: TIPSXXXXXXX
    # an incoming payment's answer is due this long after receipt, and sent until this window after it (§6.2, §6.5);
    # with the window within the CSM's answer timeout (specs/20-testing-strategy.md §2.1)
    answer-deadline-offset: 5s
    answer-transmit-window: 1s
    transmit:
      # a claimed transmission is not taken again before this (§6.5)
      lease: 2s
      # how often the worker looks for due and expired transmissions (§6.5)
      poll-interval: 50ms
    timeouts:
      connect: 200ms
      read: 1s

springdoc:
  # a stable document to check in (specs/00-engineering-baseline.md §7)
  writer-with-order-by-keys: true
