spring:
  application:
    name: ledger-service
  jackson:
    # optional response fields (closedAt, holder.organisationId, …) are absent, not null
    default-property-inclusion: non_null
  transaction:
    # no transaction outlives the snapshot settle time of 60 s, so none can commit a posting below a snapshot
    # boundary (specs/12-ledger-service.md §6.3)
    default-timeout: 30s
  flyway:
    placeholders:
      # the IBANs of the seeded technical accounts (V2__technical_accounts.sql)
      bankCode: ${tpe.bank.bank-code}

management:
  endpoint:
    health:
      probes:
        enabled: true

tpe:
  bank:
    # specs/12-ledger-service.md §7: must equal ownBankCode in the bank directory
    bank-code: "10010010"
  ledger:
    optimistic-retry:
      # attempts in all of a transaction that lost the optimistic lock on a customer account (specs/12-ledger-service.md §6.2)
      max-attempts: 5
    funding:
      # POST /v1/accounts/{id}/funding (12 §3.2, §7): on in the local and test profiles only; prod refuses to start with it
      enabled: false
    idempotency:
      # keys older than this are deleted hourly (specs/12-ledger-service.md §6.1, §7)
      retention: 30d
    snapshot:
      # technical-account balance snapshots (specs/12-ledger-service.md §6.3, §7)
      interval: 15m
    account-tombstones:
      # the daily job deleting accounts closed 13 months ago from accounts.events (specs/12-ledger-service.md §4, §7)
      poll-interval: 1d
  messaging:
    # the outbox of accounts.events (specs/12-ledger-service.md §4)
    enabled: true

springdoc:
  # a stable document to check in (specs/00-engineering-baseline.md §7)
  writer-with-order-by-keys: true
