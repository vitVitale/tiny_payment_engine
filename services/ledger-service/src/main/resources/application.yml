spring:
  application:
    name: ledger-service
  jackson:
    # optional response fields (closedAt, holder.organisationId, …) are absent, not null
    default-property-inclusion: non_null
  flyway:
    placeholders:
      # the IBANs of the seeded technical accounts (V2__technical_accounts.sql)
      bankCode: ${tpe.bank.bank-code}

management:
  endpoint:
    health:
      probes:
        enabled: true

tpe:
  bank:
    # specs/12-ledger-service.md §7: must equal ownBankCode in the bank directory
    bank-code: "10010010"
  ledger:
    idempotency:
      # keys older than this are deleted hourly (specs/12-ledger-service.md §6.1, §7)
      retention: 30d
  messaging:
    # the outbox of accounts.events (specs/12-ledger-service.md §4)
    enabled: true

springdoc:
  # a stable document to check in (specs/00-engineering-baseline.md §7)
  writer-with-order-by-keys: true
