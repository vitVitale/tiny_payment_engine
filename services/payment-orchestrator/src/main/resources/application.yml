spring:
  application:
    name: payment-orchestrator
  config:
    import: ${tpe.bank-directory.location:classpath:bank-directory.yml}

management:
  endpoint:
    health:
      probes:
        enabled: true

tpe:
  messaging:
    # outbox and inbox (specs/11-payment-orchestrator.md §4, §5)
    enabled: true
  outgoing:
    # specs/11-payment-orchestrator.md §7; startup fails unless hold-give-up-margin < send-by-offset < deadline-offset
    send-by-offset: 10s
    deadline-offset: 20s
    hold-give-up-margin: 2s
  runner:
    # specs/11-payment-orchestrator.md §6.3, §7
    lease: 5s
    max-backoff: 30s
    max-concurrency: 256
    # what a remote call leaves before its deadline (send_by, answer_deadline)
    safety-margin: 100ms
    # a ledger action retried forever opens a LEDGER_ACTION_STUCK case after this long
    stuck-after: 10m
  clients:
    risk:
      base-url: http://risk-service:8084
      timeout:
        # UC-04 2c, UC-06 3
        outgoing: 500ms
        incoming: 300ms
    ledger:
      base-url: http://ledger-service:8082
      timeout: 1s

springdoc:
  # a stable document to check in (specs/00-engineering-baseline.md §7)
  writer-with-order-by-keys: true
