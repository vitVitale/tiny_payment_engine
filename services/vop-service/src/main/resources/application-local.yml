# Local compose stack (specs/00-engineering-baseline.md §13): docker compose -f deploy/docker-compose.yml up -d postgres kafka oauth2
server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vop
    username: vop
    # local only, see deploy/postgres/init.sql
    password: vop-local
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8099/default
tpe:
  vop:
    # local only: the responder audit pepper is a secret everywhere else (specs/13-vop-service.md §7, ADR-017)
    audit-peppers:
      "1": vop-local-audit-pepper
    active-pepper-version: 1
