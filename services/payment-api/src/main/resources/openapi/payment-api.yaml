openapi: 3.1.0
info:
  description: "Customer channels' API for SCT Inst payments (UC-01, UC-02, UC-07)"
  title: payment-api
  version: v1
servers:
- url: /
paths:
  /v1/payee-verifications:
    post:
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResponse"
          description: The verification and the reference to pay with
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "VALIDATION_FAILED with errors[], e.g. INVALID_IBAN"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Scope vop:verify missing, or DEBTOR_ACCOUNT_NOT_OWNED"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: PAYEE_BANK_UNKNOWN
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: VOP_UNAVAILABLE; retry after Retry-After
      security:
      - bearer:
        - vop:verify
      summary: Verify a payee before paying (UC-02)
      tags:
      - payee-verification-controller
  /v1/payment-rejections/{rejectionId}/pain.002:
    get:
      operationId: rejectionPain002
      parameters:
      - in: path
        name: rejectionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/xml:
              schema:
                type: string
          description: pain.002.001.10 with GrpSts RJCT and reason FF01
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "REJECTION_NOT_FOUND: unknown, expired, or not the caller's"
      security:
      - bearer:
        - payments:read
      summary: The pain.002.001.10 RJCT FF01 of a rejected pain.001 (UC-01 3a)
      tags:
      - payment-rejection-controller
  /v1/payments:
    post:
      operationId: initiate
      parameters:
      - description: The same key is the same payment
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[A-Za-z0-9_-]{1,64}$"
      - description: "With application/xml: the vopReference of the payee verification\
          \ (POST /v1/payee-verifications); without it the payment is VOP_REQUIRED"
        in: header
        name: VoP-Reference
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInstruction"
          application/xml:
            schema:
              type: string
              description: pain.001.001.09 with one PmtInf and one CdtTrfTxInf
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "Accepted; Location is the payment's status. The same key and\
            \ body (an XML document: comments aside) again answer the same payment\
            \ with its current status"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "VALIDATION_FAILED with errors[] (for XML with the rejectionId\
            \ of a pain.002 RJCT FF01 at /v1/payment-rejections/{rejectionId}/pain.002;\
            \ a DOCTYPE included), UNSUPPORTED_MEDIA_TYPE_VARIANT (XML: not one PmtInf\
            \ with one CdtTrfTxInf, another version, not INST, not today), IDEMPOTENCY_KEY_MISSING,\
            \ IDEMPOTENCY_KEY_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No valid Bearer token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Scope payments:write missing, or DEBTOR_ACCOUNT_NOT_OWNED"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "IDEMPOTENCY_KEY_IN_PROGRESS: a request with the key is being\
            \ processed"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "VOP_REQUIRED, CREDITOR_AGENT_NOT_REACHABLE, IDEMPOTENCY_KEY_REUSED"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "ORCHESTRATOR_UNAVAILABLE, VOP_UNAVAILABLE; retry after Retry-After\
            \ with the same Idempotency-Key"
      security:
      - bearer:
        - payments:write
      summary: "Initiate an SCT Inst payment, as JSON or as pain.001.001.09 (UC-01)"
      tags:
      - payment-controller
  /v1/payments/{paymentId}:
    get:
      operationId: status
      parameters:
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
          description: The payment's customer status
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "PAYMENT_NOT_FOUND: unknown, or not the caller's"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: ORCHESTRATOR_UNAVAILABLE; retry after Retry-After
      security:
      - bearer:
        - payments:read
      summary: The status of a payment (UC-07)
      tags:
      - payment-status-controller
  /v1/payments/{paymentId}/pain.002:
    get:
      operationId: pain002
      parameters:
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/xml:
              schema:
                type: string
          description: pain.002.001.10 with GrpSts and TxSts
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "PAYMENT_NOT_FOUND: unknown, or not the caller's"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: ORCHESTRATOR_UNAVAILABLE; retry after Retry-After
      security:
      - bearer:
        - payments:read
      summary: The status of a payment as pain.002.001.10 (UC-07)
      tags:
      - payment-status-controller
components:
  schemas:
    Amount:
      type: object
      properties:
        currency:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
      required:
      - currency
      - value
    Creditor:
      type: object
      properties:
        bic:
          type: string
        iban:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required:
      - iban
      - name
    Debtor:
      type: object
      properties:
        iban:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required:
      - iban
      - name
    PaymentInstruction:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
        creditor:
          $ref: "#/components/schemas/Creditor"
        debtor:
          $ref: "#/components/schemas/Debtor"
        endToEndId:
          type: string
          minLength: 1
        remittanceInformation:
          type: string
        vopReference:
          type: string
      required:
      - amount
      - creditor
      - debtor
      - endToEndId
    PaymentResponse:
      type: object
      properties:
        acceptedAt:
          type: string
          format: date-time
        internalState:
          type: string
          enum:
          - RECEIVED
          - RISK_CHECKED
          - FUNDS_RESERVED
          - SENT_TO_CSM
          - ACCEPT_REQUESTED
          - ACCEPTED
          - INVESTIGATING
          - SETTLED
          - REJECTED
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PDNG
          - ACSC
          - RJCT
    PaymentStatusResponse:
      type: object
      properties:
        acceptedAt:
          type: string
          format: date-time
        amount:
          $ref: "#/components/schemas/Amount"
        creditor:
          $ref: "#/components/schemas/Creditor"
        endToEndId:
          type: string
        finalisedAt:
          type: string
          format: date-time
        internalState:
          type: string
          enum:
          - RECEIVED
          - RISK_CHECKED
          - FUNDS_RESERVED
          - SENT_TO_CSM
          - ACCEPT_REQUESTED
          - ACCEPTED
          - INVESTIGATING
          - SETTLED
          - REJECTED
        paymentId:
          type: string
          format: uuid
        reasonCode:
          type: string
        status:
          type: string
          enum:
          - PDNG
          - ACSC
          - RJCT
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code (specs/10-payment-api.md §3.5)
        detail:
          type: string
        errors:
          type: array
          description: "VALIDATION_FAILED only: the invalid fields"
          items:
            type: object
            properties:
              code:
                type: string
                description: "Field error code, e.g. INVALID_IBAN"
              field:
                type: string
                description: "JSON path, e.g. debtor.iban"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Request:
      type: object
      properties:
        debtorIban:
          type: string
        payeeIban:
          type: string
        payeeName:
          type: string
        payeeOrganisationId:
          type: string
    VerificationResponse:
      type: object
      properties:
        actualName:
          type: string
        expiresAt:
          type: string
          format: date-time
        respondedBy:
          type: string
        result:
          type: string
          enum:
          - MATCH
          - CLOSE_MATCH
          - NO_MATCH
          - NOT_POSSIBLE
        vopReference:
          type: string
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: "Claims client_id, scope and accounts (specs/00-engineering-baseline.md\
        \ §12.1)"
      scheme: bearer
      type: http
